# Render Blueprint — free, always-on (with idle spin-down) hosting.
# Deploy: push this repo to a PRIVATE GitHub repo, then in Render create a new
# Blueprint from it and fill in the four secret env vars below.
services:
  - type: web
    name: stock-overview-512a6c65   # random, unlisted URL
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DISPLAY_CURRENCY
        value: GBP
      # Set these in the Render dashboard (Environment) — not stored in git.
      # One read-only key pair per Trading 212 account; leave unused ones empty.
      - key: T212_INVEST_API_KEY
        sync: false
      - key: T212_INVEST_API_SECRET
        sync: false
      - key: T212_ISA_API_KEY
        sync: false
      - key: T212_ISA_API_SECRET
        sync: false
      - key: T212_API_KEY            # older single-account setup
        sync: false
      - key: T212_API_SECRET
        sync: false
      - key: UK_RESIDENT_FROM        # optional, YYYY-MM-DD
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SECRET       # signs the login cookie; keeps you logged in
        sync: false
